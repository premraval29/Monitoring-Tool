name: Build Desktop Application (Windows .exe, macOS .app, Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PulseMon-Windows-x64.exe
            asset_path: dist/PulseMon.exe
          - os: macos-latest
            artifact_name: PulseMon-macOS.zip
            asset_path: dist/PulseMon.app
          - os: ubuntu-latest
            artifact_name: PulseMon-Linux-x86_64
            asset_path: dist/PulseMon

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Standalone Native Executable via PyInstaller
        run: |
          pyinstaller pulsemon.spec --clean

      - name: Prepare macOS Application Bundle Archive
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r PulseMon-macOS.zip PulseMon.app
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/PulseMon.exe
            dist/PulseMon-macOS.zip
            dist/PulseMon
          if-no-files-found: error

